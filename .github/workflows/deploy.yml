name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

defaults:
  run:
    working-directory: infra

jobs:
  build:
    uses: ./.github/workflows/build-and-test.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_runtime_boundary_arn: ${{ vars.AWS_RUNTIME_BOUNDARY_ARN }}
      TF_VAR_cognito_domain_prefix: ${{ vars.COGNITO_DOMAIN_PREFIX }}
      TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      TF_VAR_owner_email: ${{ secrets.OWNER_EMAIL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: lambda-packages
          path: build

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.4'

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - run: terraform init -input=false -lockfile=readonly -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=terraform.tfstate"

      - run: terraform apply -input=false -auto-approve -lock-timeout=2m

      - run: terraform output -raw website_url
